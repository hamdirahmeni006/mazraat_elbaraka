<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>مزرعة البركة — الإدارة</title>
<meta name="description" content="تطبيق إدارة مزرعة البركة : المخزون، الصندوق، المزودين، الفواتير.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B5A2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مزرعة البركة">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   MAZRAAT EL BARAKA — design system
   vert profond #0B5A2A · vert #14803D · vert clair #43B45C
   or #F2A413 · crème #FFF8E7 · encre #14241A
   ============================================================ */
:root{
  --g900:#06421F; --g800:#0B5A2A; --g700:#14803D; --g600:#1E9A4C; --g300:#8BD48F; --g100:#E6F4E8;
  --gold:#F2A413; --gold-soft:#FDEFCB; --cream:#FFF8E7;
  --bg:#F3F7F2; --surface:#FFFFFF; --surface-2:#FAFCF9;
  --ink:#14241A; --mute:#6E8175; --line:#E3EBE1;
  --danger:#C93B3B; --danger-soft:#FCEAEA;
  --info:#1E6F9F; --info-soft:#E6F1F8;
  --warn:#B57900; --warn-soft:#FFF3D6;
  --r:18px; --r-sm:12px; --r-lg:26px;
  --sh:0 10px 28px -18px rgba(6,66,31,.55);
  --sh-lg:0 24px 60px -30px rgba(6,66,31,.6);
  --nav-h:66px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
input,select,textarea{outline:none}
a{color:var(--g700)}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;unicode-bidi:isolate}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--g700);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14.5px;
  box-shadow:0 8px 20px -12px rgba(11,90,42,.9);transition:transform .12s,filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.ghost{background:var(--g100);color:var(--g800);box-shadow:none}
.btn.line{background:transparent;color:var(--g800);border:1.5px solid var(--line);box-shadow:none}
.btn.gold{background:var(--gold);color:#3A2A00;box-shadow:0 8px 20px -12px rgba(242,164,19,.9)}
.btn.dan{background:var(--danger)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn.xs{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.14);color:#fff;flex:0 0 auto}
.icon-btn.dark{background:var(--g100);color:var(--g800)}

/* ---------- champs ---------- */
.field{margin-bottom:13px}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:6px}
.inp{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:13px;
  padding:12px 14px;font-size:15px;transition:border-color .15s,background .15s}
.inp:focus{border-color:var(--g600);background:#fff}
textarea.inp{min-height:78px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:left 18px top 50%,left 13px top 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-left:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hint{font-size:12px;color:var(--mute);margin-top:5px;line-height:1.5}

/* ---------- écran d'accueil / login ---------- */
#splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--g800);z-index:200}
#splash .mark{width:104px;height:104px;border-radius:26px;overflow:hidden;box-shadow:var(--sh-lg);animation:pop .7s cubic-bezier(.2,.9,.2,1)}
#splash img{width:100%;height:100%;display:block}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}

#auth{min-height:100dvh;display:grid;place-items:center;padding:24px 18px calc(24px + var(--safe-b));
  background:radial-gradient(120% 80% at 50% 0%,#14803D 0%,#0B5A2A 55%,#06421F 100%)}
.auth-card{width:100%;max-width:400px;background:var(--surface);border-radius:var(--r-lg);padding:26px 22px 22px;box-shadow:var(--sh-lg)}
.auth-logo{width:88px;height:88px;border-radius:24px;margin:0 auto 14px;display:block;box-shadow:var(--sh)}
.auth-card h1{text-align:center;font-size:24px;color:var(--g800)}
.auth-card .sub{text-align:center;color:var(--mute);font-size:13px;margin:6px 0 20px}
.msg{font-size:13px;margin-top:12px;padding:11px 13px;border-radius:12px;line-height:1.6;display:none}
.msg.on{display:block}
.msg.err{background:var(--danger-soft);color:#8E2323}
.msg.ok{background:var(--g100);color:var(--g800)}
.msg.info{background:var(--info-soft);color:var(--info)}

/* ---------- shell ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,#14803D,#0B5A2A);
  color:#fff;padding:calc(10px + var(--safe-t)) 14px 12px;box-shadow:0 6px 22px -14px rgba(6,66,31,.9)}
.topbar .line1{display:flex;align-items:center;gap:11px}
.topbar .logo{width:40px;height:40px;border-radius:12px;flex:0 0 auto;box-shadow:0 4px 12px -6px #000}
.topbar .tt{flex:1;min-width:0}
.topbar h1{font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:11.5px;opacity:.82;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#8BD48F;margin-left:5px;vertical-align:middle}
.dot.off{background:#F2A413}.dot.err{background:#FF8A8A}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:14px 13px calc(var(--nav-h) + 26px + var(--safe-b))}
.page{display:none}
.page.on{display:block;animation:rise .32s cubic-bezier(.2,.9,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 13px}
.page-head h2{font-size:20px;color:var(--g800)}
.page-head .sub{font-size:12.5px;color:var(--mute);margin-top:2px}

/* ---------- nav bas ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px 4px calc(4px + var(--safe-b));display:flex;justify-content:space-around}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  color:var(--mute);font-size:10.5px;font-weight:700;border-radius:12px;transition:color .15s}
nav button svg{width:23px;height:23px;stroke-width:1.9}
nav button.on{color:var(--g700)}
nav button.on svg{stroke-width:2.4}

/* ---------- cartes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--sh);margin-bottom:12px}
.card>h3{font-size:15.5px;color:var(--g800);margin-bottom:3px}
.card .csub{font-size:12px;color:var(--mute);margin-bottom:11px}
.sec-title{font-size:13px;font-weight:800;color:var(--mute);margin:18px 3px 9px;letter-spacing:.02em}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .lb{font-size:11.5px;color:var(--mute);font-weight:700;display:flex;align-items:center;gap:5px}
.kpi .vl{font-size:20px;font-weight:900;color:var(--g800);margin-top:5px;letter-spacing:-.02em}
.kpi .ex{font-size:11px;color:var(--mute);margin-top:2px}
.kpi.hero{grid-column:span 2;background:linear-gradient(135deg,#14803D,#0B5A2A);border:none;color:#fff}
.kpi.hero .lb,.kpi.hero .ex{color:rgba(255,255,255,.82)}
.kpi.hero .vl{color:#fff;font-size:29px}
.kpi.gold .vl{color:var(--warn)}
.kpi.dan .vl{color:var(--danger)}

/* ---------- listes ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;
  display:flex;align-items:center;gap:11px;box-shadow:0 4px 14px -12px rgba(6,66,31,.5)}
.item .av{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--g100);color:var(--g700);font-size:19px}
.item .bd{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mt{font-size:11.5px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rt{text-align:left;flex:0 0 auto}
.item .amt{font-weight:800;font-size:14.5px;color:var(--g800)}
.item .amt.neg{color:var(--danger)}
.item.tap{cursor:pointer;transition:transform .12s}
.item.tap:active{transform:scale(.985)}
.empty{text-align:center;padding:34px 18px;color:var(--mute);font-size:13.5px}
.empty .ic{font-size:36px;margin-bottom:8px;opacity:.55}

.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
  background:var(--g100);color:var(--g800)}
.tag.gold{background:var(--gold-soft);color:var(--warn)}
.tag.dan{background:var(--danger-soft);color:var(--danger)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.mute{background:#EFF2EE;color:var(--mute)}

/* ---------- barre d'outils ---------- */
.tools{display:flex;gap:8px;margin-bottom:11px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:11px 40px 11px 13px;font-size:14px}
.search input:focus{border-color:var(--g600)}
.search .si{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:11px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--mute);white-space:nowrap;flex:0 0 auto}
.chip.on{background:var(--g800);color:#fff;border-color:var(--g800)}

/* ---------- onglets ---------- */
.tabs{display:flex;background:var(--g100);border-radius:14px;padding:4px;gap:4px;margin-bottom:13px}
.tabs button{flex:1;padding:9px;border-radius:11px;font-size:13px;font-weight:700;color:var(--mute)}
.tabs button.on{background:var(--surface);color:var(--g800);box-shadow:0 4px 12px -8px rgba(6,66,31,.6)}

/* ---------- feuille modale ---------- */
.sheet{position:fixed;inset:0;z-index:100;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(6,40,20,.5);animation:fade .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .pnl{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;background:var(--surface);
  border-radius:26px 26px 0 0;padding:8px 16px calc(20px + var(--safe-b));overflow-y:auto;
  animation:up .32s cubic-bezier(.2,.9,.2,1);box-shadow:var(--sh-lg)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:42px;height:4px;background:var(--line);border-radius:9px;margin:6px auto 12px}
.sheet h3{font-size:18px;color:var(--g800);margin-bottom:14px}
.sheet .foot{display:flex;gap:9px;margin-top:16px;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.sheet .foot .btn{flex:1}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + var(--safe-b));transform:translateX(-50%) translateY(18px);
  background:var(--g900);color:#fff;padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:150;max-width:90vw;text-align:center;box-shadow:var(--sh-lg)}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- caisse / POS ---------- */
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:9px}
.pcard{background:var(--surface);border:1.5px solid var(--line);border-radius:15px;padding:10px;text-align:center;
  transition:transform .12s,border-color .15s;position:relative;overflow:hidden}
.pcard:active{transform:scale(.96)}
.pcard .ic{font-size:23px}
.pcard .nm{font-size:12.5px;font-weight:700;margin-top:4px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.pcard .pr{font-size:12.5px;font-weight:800;color:var(--g700);margin-top:3px}
.pcard .st{font-size:10.5px;color:var(--mute);margin-top:1px}
.pcard.low{border-color:#F3C88A}
.pcard.out{opacity:.55}
.cart-bar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));z-index:44;padding:0 11px 9px}
.cart-inner{max-width:960px;margin:0 auto;background:linear-gradient(135deg,#14803D,#0B5A2A);color:#fff;
  border-radius:17px;padding:12px 15px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh-lg)}
.cart-inner .n{background:rgba(255,255,255,.2);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px}
.cart-inner .t{flex:1}
.cart-inner .t .a{font-size:18px;font-weight:900}
.cart-inner .t .b{font-size:11px;opacity:.85}
.cart-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cart-line:last-child{border:none}
.cart-line .bd{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:0;background:var(--g100);border-radius:11px;overflow:hidden;flex:0 0 auto}
.qty button{width:32px;height:32px;color:var(--g800);font-size:17px;font-weight:800;display:grid;place-items:center}
.qty input{width:52px;text-align:center;background:transparent;border:none;font-weight:800;font-size:13.5px;padding:0}
.tot-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.tot-row.big{font-size:19px;font-weight:900;color:var(--g800);border-top:1.5px dashed var(--line);margin-top:6px;padding-top:11px}

/* ---------- graphique ---------- */
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding:8px 2px 0}
.chart .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.chart .bar .fill{width:100%;background:linear-gradient(180deg,#43B45C,#14803D);border-radius:7px 7px 3px 3px;min-height:3px;transition:height .5s cubic-bezier(.2,.9,.2,1)}
.chart .bar .lb{font-size:9.5px;color:var(--mute);font-weight:700}
.chart .bar .vl{font-size:9.5px;color:var(--g700);font-weight:800}

/* ---------- alerte ---------- */
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border-radius:14px;font-size:13px;line-height:1.55;margin-bottom:9px}
.alert .ic{font-size:17px;flex:0 0 auto}
.alert.warn{background:var(--warn-soft);color:#7A5200}
.alert.dan{background:var(--danger-soft);color:#8E2323}
.alert.info{background:var(--info-soft);color:#12506F}
.alert.ok{background:var(--g100);color:var(--g800)}
.alert b{font-weight:800}

/* ---------- tableaux (rapports) ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;font-size:11.5px;color:var(--mute);padding:7px 6px;border-bottom:1.5px solid var(--line);font-weight:800}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border:none}
.tbl .n{text-align:left;font-weight:700}

/* ---------- réglages ---------- */
.srow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:none}
.srow .bd{flex:1;min-width:0}
.srow .nm{font-weight:700;font-size:14px}
.srow .ds{font-size:11.5px;color:var(--mute);margin-top:2px;line-height:1.5}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--g600)}
.sw.on::after{transform:translateX(-20px)}

/* ---------- grand écran ---------- */
@media(min-width:900px){
  #app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto 1fr;
    grid-template-areas:"nav head" "nav main";min-height:100dvh}
  .topbar{grid-area:head}
  main{grid-area:main;padding:20px 22px 44px;max-width:900px}
  nav{grid-area:nav;position:sticky;top:0;align-self:start;height:100dvh;
    flex-direction:column;justify-content:flex-start;gap:3px;overflow-y:auto;
    border-top:none;border-left:1px solid var(--line);padding:16px 10px;background:var(--surface)}
  nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;
    padding:12px 14px;font-size:14px;width:100%}
  nav button.on{background:var(--g100)}
  nav button svg{width:21px;height:21px}
  .cart-bar{bottom:0;padding-bottom:16px;left:0;right:232px}
  #toast{bottom:26px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi.hero{grid-column:span 2}
  .pos-grid{grid-template-columns:repeat(auto-fill,minmax(126px,1fr))}
  .sheet .pnl{max-width:580px;margin:0 auto;border-radius:26px;bottom:auto;top:50%;
    transform:translateY(-50%);max-height:88dvh;padding:8px 22px 22px}
  @keyframes up{from{opacity:0;transform:translateY(-46%)}to{opacity:1;transform:translateY(-50%)}}
}

/* ---------- impression ---------- */
#print{display:none}
@media print{
  body{background:#fff}
  body>*{display:none!important}
  #print{display:block!important;padding:0}
  @page{margin:12mm}
}
.doc{font-family:"Cairo",sans-serif;color:#000;font-size:12px}
.doc .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid #0B5A2A;padding-bottom:10px;margin-bottom:14px}
.doc .hd h1{font-size:20px;color:#0B5A2A}
.doc .hd .r{text-align:left;font-size:11px;line-height:1.7}
.doc h2{font-size:16px;margin:0 0 3px}
.doc table{width:100%;border-collapse:collapse;margin:12px 0;font-size:11.5px}
.doc th{background:#E6F4E8;padding:7px;border:1px solid #B9D9C0;text-align:right;font-size:11px}
.doc td{padding:7px;border:1px solid #D8E6DA}
.doc .tot{width:58%;margin-right:auto;font-size:12px}
.doc .tot td{border:none;padding:4px 7px}
.doc .tot .g{font-weight:900;font-size:14px;border-top:2px solid #0B5A2A;color:#0B5A2A}
.doc .ft{margin-top:20px;font-size:10.5px;color:#444;border-top:1px solid #ccc;padding-top:9px;line-height:1.7}
.ticket{width:74mm;font-size:11.5px;line-height:1.5}
.ticket .c{text-align:center}
.ticket table{width:100%;border-collapse:collapse}
.ticket td{padding:2px 0;border:none}

function money(n, d = 3){
  n = Number(n) || 0;
  const p = Math.abs(n).toFixed(d).split(".");
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (n < 0 ? "−" : "") + p.join(".");
}

/* ============================================================

async function initFirebase(){
  const [app, auth, store, msg] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"),
    import("https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging.js").catch(() => null)
  ]);
  const a = app.initializeApp(FIREBASE_CONFIG);
  let db;
  try{
    db = store.initializeFirestore(a, { localCache: store.persistentLocalCache({ tabManager: store.persistentMultipleTabManager() }) });
  }catch(e){ db = store.getFirestore(a); }

  fb = {
    app:a, db, auth: auth.getAuth(a),
    signIn: auth.signInWithEmailAndPassword, onAuth: auth.onAuthStateChanged,
    signOut: auth.signOut, reset: auth.sendPasswordResetEmail,
    collection: store.collection, doc: store.doc, addDoc: store.addDoc, setDoc: store.setDoc,
    updateDoc: store.updateDoc, deleteDoc: store.deleteDoc, getDoc: store.getDoc, getDocs: store.getDocs,
    onSnapshot: store.onSnapshot, query: store.query, where: store.where, orderBy: store.orderBy,
    limit: store.limit, increment: store.increment, writeBatch: store.writeBatch, serverTimestamp: store.serverTimestamp
  };
  try{ await auth.setPersistence(fb.auth, auth.browserLocalPersistence); }catch(e){}
  if(msg && await msg.isSupported().catch(() => false)){
    fb.messaging = msg.getMessaging(a); fb.getToken = msg.getToken; fb.onMessage = msg.onMessage;
  }
  return true;
}

const col = n => fb.collection(fb.db, n);
const ref = (c, id) => fb.doc(fb.db, c, id);
async function add(c, data){ return fb.addDoc(col(c), { ...data, _at: Date.now(), _by: S.user?.email || "" }); }
async function upd(c, id, data){ return fb.updateDoc(ref(c, id), { ...data, _at: Date.now() }); }
async function del(c, id){ return fb.deleteDoc(ref(c, id)); }

/* --- abonnements temps réel --- */
let SUBS = [];
function stopSubs(){ SUBS.forEach(u => { try{ u(); }catch(e){} }); SUBS = []; }
function sub(name, q, key){
  SUBS.push(fb.onSnapshot(q,
    snap => { S[key] = snap.docs.map(d => ({ id:d.id, ...d.data() })); S.ready[key] = true; refresh(); },
    err => { console.warn("snapshot " + name, err); setDot("err"); }
  ));
}
function startSubs(){
  stopSubs();
  sub("products",  fb.query(col("products"),  fb.orderBy("name")), "products");
  sub("suppliers", fb.query(col("suppliers"), fb.orderBy("name")), "suppliers");
  sub("clients",   fb.query(col("clients"),   fb.orderBy("name")), "clients");
  sub("sales",     fb.query(col("sales"),     fb.orderBy("ts","desc"), fb.limit(700)), "sales");
  sub("cash",      fb.query(col("cash"),      fb.orderBy("ts","desc"), fb.limit(700)), "cash");
  sub("purchases", fb.query(col("purchases"), fb.orderBy("ts","desc"), fb.limit(300)), "purchases");
  sub("docs",      fb.query(col("docs"),      fb.orderBy("ts","desc"), fb.limit(300)), "docs");
  SUBS.push(fb.onSnapshot(ref("meta","settings"), s => {
    if(s.exists()) S.set = { ...DEF_SET, ...s.data() };
    else fb.setDoc(ref("meta","settings"), DEF_SET).catch(() => {});
    refresh();
  }, e => console.warn("settings", e)));
}
async function saveSet(patch){
  S.set = { ...S.set, ...patch };
  try{ await fb.setDoc(ref("meta","settings"), S.set, { merge:true }); }catch(e){ console.warn(e); }
}

const AU_ERR = {
  "auth/invalid-email":"البريد الإلكتروني غير صحيح.",
  "auth/user-not-found":"ما فماش حساب بهذا البريد. أنشئه في Firebase > Authentication.",
  "auth/wrong-password":"كلمة السر غالطة.",
  "auth/invalid-credential":"البريد أو كلمة السر غالطين.",
  "auth/too-many-requests":"محاولات برشا. استنى شوية وعاود.",
  "auth/network-request-failed":"ما فماش أنترنت. عاود كي ترجع الشبكة.",
  "auth/user-disabled":"هذا الحساب معطّل من طرف المسؤول."
};
async function doAuth(){
  const m = $("#au-mail").value.trim(), p = $("#au-pass").value;
  if(!m || !p) return say("عمّر البريد وكلمة السر.");
  $("#au-go").disabled = true; say("جاري الدخول…", "info");
  try{
    await fb.signIn(fb.auth, m, p);
    $("#au-msg").className = "msg";
  }catch(e){
    say(AU_ERR[e.code] || ("خطأ : " + (e.code || e.message)));
  }finally{ $("#au-go").disabled = false; }
}
$("#au-go").addEventListener("click", doAuth);
$("#au-pass").addEventListener("keydown", e => e.key === "Enter" && doAuth());
$("#au-forgot").addEventListener("click", async () => {
  const m = $("#au-mail").value.trim();
  if(!m) return say("اكتب البريد الإلكتروني الأول.");
  try{ await fb.reset(fb.auth, m); say("بعثنالك إيميل باش تبدّل كلمة السر. شوف حتى في spam.", "ok"); }
  catch(e){ say(AU_ERR[e.code] || "ما نجمناش نبعثو الإيميل."); }
});

        ${clients.map(c => `<option value="${c.id}">${esc(c.name)}${(c.balance || 0) > 0 ? " (دين " + money(c.balance) + ")" : ""}</option>`).join("")}
        <option value="__new">➕ حريف جديد…</option></select></div>
    <div class="tot-row"><span>المجموع الفرعي</span><b id="c-sub">${DT(cartTotal())}</b></div>
    <div class="tot-row big"><span>الخالص</span><span id="c-tot">${DT(cartTotal())}</span></div>
    <label style="display:flex;align-items:center;gap:9px;margin-top:10px;font-size:13.5px">
      <input type="checkbox" id="c-print" style="width:19px;height:19px;accent-color:#14803D"> طبع تيكي بعد البيع</label>
    <div class="foot"><button class="btn line" data-act="close">رجوع</button>
      <button class="btn" id="c-ok">${ic("check",17)} تأكيد البيع</button></div>`,
  () => {
    const upd8 = () => {
      const t = Math.max(0, cartTotal() - num($("#c-rem").value));
      $("#c-sub").innerHTML = DT(cartTotal()); $("#c-tot").innerHTML = DT(t);
    };
    $("#c-rem").oninput = upd8;
    $("#c-mode").onchange = e => {
      $("#c-cli-wrap").classList.toggle("hidden", e.target.value !== "credit");
    };
    $("#c-cli").onchange = async e => {
      if(e.target.value === "__new"){ e.target.value = ""; closeSheet(); newClient(() => openCart()); }
    };
    $("#cart-lines").onclick = ev => {
      const b = ev.target.closest("[data-cl]"); if(!b) return;
      const i = +b.dataset.i, d = b.dataset.cl;
      if(d === "+") CART[i].qty = Math.round((CART[i].qty + 1) * 1000) / 1000;
      if(d === "-") CART[i].qty = Math.round((CART[i].qty - 1) * 1000) / 1000;
      if(d === "x" || CART[i].qty <= 0) CART.splice(i, 1);
      if(!CART.length){ closeSheet(); cartSync(); render("p-pos"); return; }
      $("#cart-lines").innerHTML = cartLines(); upd8(); cartSync();
    };
    $("#cart-lines").oninput = ev => {
      const inp = ev.target.closest("input[data-i]"); if(!inp) return;
      CART[+inp.dataset.i].qty = num(inp.value); upd8(); cartSync();
    };
    $("#c-ok").onclick = doSale;
  });
}
const cartLines = () => CART.map((l, i) => `<div class="cart-line">
  <div class="bd"><div class="nm" style="font-weight:700;font-size:14px">${esc(l.name)}</div>
    <div class="mt" style="font-size:11.5px;color:var(--mute)">${money(l.price)} د.ت / ${esc(l.unit)} = <b>${money(l.qty * l.price)}</b></div></div>
  <div class="qty"><button data-cl="-" data-i="${i}">−</button>
    <input type="number" step="0.001" inputmode="decimal" data-i="${i}" value="${qtyF(l.qty)}" dir="ltr">
    <button data-cl="+" data-i="${i}">+</button></div>
  <button class="icon-btn dark" style="width:34px;height:34px" data-cl="x" data-i="${i}">${ic("x",16)}</button>
</div>`).join("");

async function doSale(){
  const rem = num($("#c-rem").value), mode = $("#c-mode").value;
  const cliId = mode === "credit" ? $("#c-cli").value : "";
  const wantPrint = $("#c-print").checked;
  if(mode === "credit" && !cliId) return toast("اختار الحريف باش تسجل الدين");
  const sub = cartTotal(), total = Math.max(0, sub - rem);
  const cost = sumBy(CART, l => l.qty * (l.cost || 0));
  const short = CART.filter(l => (prod(l.id)?.qty || 0) < l.qty);
  if(short.length && !await ask("المخزون ما يكفيش","السلع هاذي كميتها في المخزون أقل من المطلوب :<br><b>" +
      short.map(s => esc(s.name)).join("، ") + "</b><br><br>تنجم تكمل والمخزون باش ينقص للسالب.", "كمّل برك")) return;

  const cli = S.clients.find(c => c.id === cliId);
  const sale = {
    no: nextNo(S.sales), ts: Date.now(), date: todayKey(),
    items: CART.map(l => ({ id:l.id, name:l.name, qty:l.qty, price:l.price, cost:l.cost, unit:l.unit })),
    sub, discount: rem, total, cost, profit: total - cost,
    mode, clientId: cliId || "", clientName: cli?.name || "",
    by: S.user?.email || ""
  };
  const b = fb.writeBatch(fb.db);
  const sref = fb.doc(col("sales")); b.set(sref, sale);
  CART.forEach(l => { const p = prod(l.id); if(p) b.update(ref("products", l.id), { qty: fb.increment(-l.qty) }); });
  if(mode !== "credit") b.set(fb.doc(col("cash")), {
    ts: sale.ts, date: sale.date, type:"in", amount: total, cat:"مبيعات",
    label:`بيع #${sale.no}${cli ? " — " + cli.name : ""}`, ref: sref.id, by: sale.by, _at: Date.now() });
  if(mode === "credit" && cliId) b.update(ref("clients", cliId), { balance: fb.increment(total) });
  b.commit().catch(e => { console.warn(e); toast("سجّلناه محليا، باش يتزامن كي ترجع الشبكة"); });

  closeSheet();
  const done = { ...sale, id: sref.id };
  CART = []; cartSync(); render("p-pos");
  toast(`تم البيع ✓ ${money(total)} د.ت`);
  if(wantPrint) printTicket(done);
}

let CSH = { per:"today" };
const PERIODS = { today:"اليوم", w:"7 أيام", m:"هذا الشهر", all:"الكل" };
function perRange(p){
  const t = todayKey();
  if(p === "today") return [t, t];
  if(p === "w")     return [addDays(t, -6), t];
  if(p === "m")     return [monthKey(t) + "-01", t];
  return ["0000-01-01", "9999-12-31"];
}
RENDER["p-cash"] = () => {
  const [a, b] = perRange(CSH.per);
  const list = cashIn(a, b);

  const out = sumBy(list.filter(c => c.type === "out"), c => c.amount);
  return `
  <div class="page-head"><div><h2>الصندوق</h2><div class="sub">الرصيد الحالي ${money(cashBal())} د.ت</div></div></div>

    <div class="kpi"><div class="lb">↘ مداخيل (${PERIODS[CSH.per]})</div><div class="vl" style="font-size:17px;color:var(--g600)">${DT(inn)}</div></div>
    <div class="kpi"><div class="lb">↗ مصاريف (${PERIODS[CSH.per]})</div><div class="vl dan" style="font-size:17px;color:var(--danger)">${DT(out)}</div></div>
  </div>

  </div>
  <div class="chips">${Object.entries(PERIODS).map(([k, v]) => `<button class="chip ${CSH.per === k ? "on" : ""}" data-act="csh-per" data-id="${k}">${v}</button>`).join("")}
    <button class="chip" data-act="day-report">🖨️ كشف اليوم</button></div>
  ${list.length ? `<div class="list">${list.map(c => `
    <div class="item tap" data-act="csh-view" data-id="${c.id}">
      <div class="av" style="background:${c.type === "in" ? "var(--g100)" : "var(--danger-soft)"};color:${c.type === "in" ? "var(--g700)" : "var(--danger)"}">${c.type === "in" ? "↘" : "↗"}</div>

      <div class="rt"><div class="amt ${c.type === "out" ? "neg" : ""}">${c.type === "in" ? "+" : "−"} ${money(c.amount)}</div></div>
    </div>`).join("")}</div>`
  : `<div class="empty"><div class="ic">💰</div>ما فماش حركات في هالفترة</div>`}`;
};

      <div class="field"><label>المبلغ المخلّص</label><input id="b-paid" class="inp" type="number" step="0.001" inputmode="decimal" dir="ltr" value="0"></div>

      $("#b-lines").innerHTML = BUY.lines.length ? BUY.lines.map((l, i) => `

          <div class="field" style="margin-bottom:8px"><select class="inp" data-bl="p" data-i="${i}">

          <div class="grid3" style="gap:7px">
            <div><label style="font-size:11px;color:var(--mute)">الكمية</label>
              <input class="inp" type="number" step="0.001" inputmode="decimal" dir="ltr" data-bl="q" data-i="${i}" value="${l.qty}"></div>
            <div><label style="font-size:11px;color:var(--mute)">سعر الشراء</label>
              <input class="inp" type="number" step="0.001" inputmode="decimal" dir="ltr" data-bl="c" data-i="${i}" value="${l.cost}"></div>
            <div><label style="font-size:11px;color:var(--mute)">سعر البيع</label>

        </div>`).join("") : `<div class="empty" style="padding:14px">اضغط «زيد سلعة»</div>`;
      const t = sumBy(BUY.lines, l => l.qty * l.cost);
      $("#b-tot").innerHTML = DT(t);
      $("#b-rest").value = money(Math.max(0, t - num($("#b-paid").value)));
    };

    $("#b-addline").onclick = () => {
      const p = S.products[0];
      BUY.lines.push({ id:p.id, qty:1, cost:p.cost || 0, price:p.price || 0 });
      drawLines();
    };
    $("#b-lines").addEventListener("click", e => {
      const b = e.target.closest("[data-bl='x']"); if(!b) return;
      BUY.lines.splice(+b.dataset.i, 1); drawLines();
    });
    $("#b-lines").addEventListener("input", e => {
      const t = e.target.closest("[data-bl]"); if(!t) return;
      const i = +t.dataset.i, k = t.dataset.bl;
      if(k === "p"){ const p = prod(t.value); BUY.lines[i] = { id:p.id, qty:BUY.lines[i].qty, cost:p.cost || 0, price:p.price || 0 }; drawLines(); return; }
      if(k === "q") BUY.lines[i].qty = num(t.value);
      if(k === "c") BUY.lines[i].cost = num(t.value);

      $("#b-tot").innerHTML = DT(tt); $("#b-rest").value = money(Math.max(0, tt - num($("#b-paid").value)));
    });
    $("#b-lines").addEventListener("change", e => { if(e.target.dataset.bl === "p") drawLines(); });
    $("#b-paid").oninput = () => { const t = sumBy(BUY.lines, l => l.qty * l.cost); $("#b-rest").value = money(Math.max(0, t - num($("#b-paid").value))); };
    $("#b-ok").onclick = saveBuy;
    drawLines();
  });

async function saveBuy(){
  if(!BUY.lines.length) return toast("زيد سلعة على الأقل");
  const total = sumBy(BUY.lines, l => l.qty * l.cost), paid = num($("#b-paid").value);
  const supId = $("#b-sup").value, sup = S.suppliers.find(s => s.id === supId);
  const date = $("#b-date").value || todayKey();
  if(!supId && total - paid > 0) return toast("اختار المزود باش نسجلو الدين");
  const items = BUY.lines.map(l => ({ id:l.id, name:prod(l.id)?.name || "", qty:l.qty, cost:l.cost, price:l.price }));
  closeSheet();
  const b = fb.writeBatch(fb.db);
  const bref = fb.doc(col("purchases"));
  b.set(bref, { no:nextNo(S.purchases), ts:Date.now(), date, supplierId:supId, supplierName:sup?.name || "",
    items, total, paid, by:S.user?.email || "", _at:Date.now() });
  items.forEach(it => b.update(ref("products", it.id), { qty: fb.increment(it.qty), cost: it.cost, price: it.price }));
  if(paid > 0) b.set(fb.doc(col("cash")), { ts:Date.now(), date, type:"out", amount:paid, cat:"شراء بضاعة",
    label:`شراء بضاعة${sup ? " — " + sup.name : ""}`, supplierId:supId, ref:bref.id, by:S.user?.email || "", _at:Date.now() });
  if(supId && total - paid > 0) b.update(ref("suppliers", supId), { balance: fb.increment(total - paid) });
  b.commit().catch(e => console.warn(e));
  BUY = { supplierId:"", lines:[], paid:0, date:todayKey() };
  toast("تسجّل الوصل والمخزون تعمّر ✓");
  go("p-buy");
}

const UNI = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const DIZ = ["","","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
function n2(n){
  if(n < 20) return UNI[n];
  const d = Math.floor(n / 10), u = n % 10;
  if(d === 7 || d === 9) return DIZ[d] + (u === 1 && d === 7 ? "-et-" : "-") + UNI[10 + u];
  let s = DIZ[d];
  if(d === 8 && u === 0) s += "s";
  if(u === 1 && d !== 8) s += "-et-un"; else if(u) s += "-" + UNI[u];
  return s;
}
function n3(n){
  const c = Math.floor(n / 100), r = n % 100; let s = "";
  if(c === 1) s = "cent"; else if(c > 1) s = UNI[c] + " cent" + (r === 0 ? "s" : "");
  if(r) s += (s ? " " : "") + n2(r);
  return s;
}
function enLettres(n){
  n = Math.floor(n); if(n === 0) return "zéro";
  const m = Math.floor(n / 1e6), k = Math.floor((n % 1e6) / 1000), r = n % 1000, s = [];
  if(m) s.push(m === 1 ? "un million" : n3(m) + " millions");
  if(k) s.push(k === 1 ? "mille" : n3(k) + " mille");
  if(r) s.push(n3(r));
  return s.join(" ");
}
const enDinars = v => {
  const d = Math.floor(v), c = Math.round((v - d) * 1000);
  return enLettres(d) + " dinar" + (d > 1 ? "s" : "") + (c ? " et " + enLettres(c) + " millimes" : "");
};

let DOC = null;
const docTot = d => {
  const ht = sumBy(d.items, i => i.qty * i.pu);
  const rem = ht * (d.remise || 0) / 100;
  const base = ht - rem;
  const tva = base * (d.tva || 0) / 100;
  const timbre = d.type === "facture" ? (d.timbre || 0) : 0;
  return { ht, rem, base, tva, timbre, ttc: base + tva + timbre };
};

let REP = { per:"m", a:todayKey(), b:todayKey() };
function repRange(){
  if(REP.per === "custom") return [REP.a, REP.b];
  if(REP.per === "lm"){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
    const m = d.toLocaleDateString("sv-SE").slice(0,7); const e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return [m + "-01", e.toLocaleDateString("sv-SE")]; }
  return perRange(REP.per);
}
RENDER["p-rep"] = () => {
  const [a, b] = repRange();
  const sl = salesIn(a, b), cs = cashIn(a, b);
  const ca = sumBy(sl, s => s.total), pr = sumBy(sl, s => s.profit);
  const dep = sumBy(cs.filter(c => c.type === "out"), c => c.amount);
  const byProd = {}, byCat = {}, byMode = {}, byDay = {};
  sl.forEach(s => {
    byMode[s.mode] = (byMode[s.mode] || 0) + s.total;
    byDay[s.date] = (byDay[s.date] || 0) + s.total;
    (s.items || []).forEach(i => {
      const p = prod(i.id), c = p?.cat || "أخرى";
      byProd[i.name] = byProd[i.name] || { q:0, ca:0, pr:0, unit:i.unit || "" };
      byProd[i.name].q += i.qty; byProd[i.name].ca += i.qty * i.price; byProd[i.name].pr += i.qty * (i.price - (i.cost || 0));
      byCat[c] = (byCat[c] || 0) + i.qty * i.price;
    });
  });
  const top = Object.entries(byProd).sort((x, y) => y[1].ca - x[1].ca).slice(0, 12);
  const cats = Object.entries(byCat).sort((x, y) => y[1] - x[1]);
  const maxCat = Math.max(...cats.map(c => c[1]), 1);
  const days = Object.entries(byDay).sort((x, y) => y[0].localeCompare(x[0])).slice(0, 31);

  return `
  <div class="page-head"><div><h2>التقارير</h2><div class="sub">${dfr(a)} → ${dfr(b)}</div></div>
    <button class="btn sm line" data-act="rep-print">${ic("print",15)}</button></div>
  <div class="chips">
    ${[["today","اليوم"],["w","7 أيام"],["m","هذا الشهر"],["lm","الشهر الفارط"],["all","الكل"],["custom","مخصص"]]
      .map(([k, v]) => `<button class="chip ${REP.per === k ? "on" : ""}" data-act="rep-per" data-id="${k}">${v}</button>`).join("")}
  </div>
  ${REP.per === "custom" ? `<div class="grid2" style="margin-bottom:12px">
    <div class="field"><label>من</label><input class="inp" type="date" dir="ltr" id="r-a" value="${REP.a}"></div>
    <div class="field"><label>إلى</label><input class="inp" type="date" dir="ltr" id="r-b" value="${REP.b}"></div></div>` : ""}
  <div class="kpis">
    <div class="kpi hero"><div class="lb">رقم المعاملات</div><div class="vl">${DT(ca)}</div>
      <div class="ex">${sl.length} عملية · معدل السلة ${money(sl.length ? ca / sl.length : 0)} د.ت</div></div>
    <div class="kpi"><div class="lb">الربح الخام</div><div class="vl" style="font-size:17px;color:var(--g600)">${DT(pr)}</div>
      <div class="ex">${ca ? Math.round(pr / ca * 100) : 0}% من المبيعات</div></div>
    <div class="kpi"><div class="lb">المصاريف</div><div class="vl" style="font-size:17px;color:var(--danger)">${DT(dep)}</div></div>
    <div class="kpi"><div class="lb">صافي الربح</div><div class="vl" style="font-size:17px">${DT(pr - sumBy(cs.filter(c => c.type === "out" && c.cat !== "شراء بضاعة"), c => c.amount))}</div>
      <div class="ex">الربح ناقص المصاريف (بلا شراء البضاعة)</div></div>
  </div>

  <div class="card"><h3>حسب الصنف</h3><div class="csub">توزيع المبيعات</div>
    ${cats.length ? cats.map(([c, v]) => `
      <div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px">
        <span>${catIc(c)} ${esc(c)}</span><b>${money(v)} د.ت</b></div>
        <div style="height:8px;background:var(--g100);border-radius:9px;overflow:hidden">
          <div style="height:100%;width:${(v / maxCat) * 100}%;background:linear-gradient(90deg,#43B45C,#14803D)"></div></div></div>`).join("")
      : `<div class="empty" style="padding:14px">لا شيء</div>`}
  </div>

  <div class="card"><h3>أفضل المنتجات</h3><div class="csub">حسب رقم المعاملات</div>
    ${top.length ? `<table class="tbl"><tr><th>المنتج</th><th class="n">الكمية</th><th class="n">المبيعات</th><th class="n">الربح</th></tr>

    <button class="btn ghost sm" data-act="exp-csv">${ic("down",15)} تصدير Excel/CSV</button>
    <button class="btn ghost sm" data-act="rep-print">${ic("print",15)} طباعة التقرير</button>
  </div>`;
};

/* ============================================================
   21) PWA — SERVICE WORKER, MISES À JOUR, NOTIFICATIONS
   ============================================================ */
async function initSW(){
  if(!("serviceWorker" in navigator)) return;
  try{
    let controlled = !!navigator.serviceWorker.controller, reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if(!controlled){ controlled = true; return; }
      if(reloading) return; reloading = true;
      toast("نسخة جديدة… جاري التحديث"); setTimeout(() => location.reload(), 900);
    });
    swReg = await navigator.serviceWorker.register("sw.js", { scope:"./" });
    const look = () => swReg && swReg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if(!document.hidden){ look(); refresh(); } });
    setInterval(look, 30 * 60 * 1000);
  }catch(e){ console.warn("SW", e); }
}
async function checkUpdate(){
  if(!swReg) return toast("التحديثات غير متوفرة هنا");
  toast("جاري البحث…");
  try{
    await swReg.update();
    setTimeout(() => {
      if(swReg.waiting){ swReg.waiting.postMessage("skipWaiting"); toast("جاري التحديث…"); }
      else toast("عندك آخر نسخة ✓");
    }, 1400);
  }catch(e){ toast("ما فماش شبكة باش نتفقدو"); }
}

async function askNotif(){
  if(!window.Notification) return toast("المتصفح ما يدعمش التنبيهات");
  if(Notification.permission === "denied") return toast("ممنوعة — فعّلها من إعدادات المتصفح");
  const p = await Notification.requestPermission();
  render("p-set");
  if(p !== "granted") return toast("ما تسمحتش بالتنبيهات");
  toast("تفعّلت التنبيهات ✓");
  initFCM();
}
function swActive(reg){
  if(reg.active) return Promise.resolve(reg);
  return new Promise(res => {
    const w = reg.installing || reg.waiting; if(!w) return res(reg);
    const t = setTimeout(() => res(reg), 9000);
    w.addEventListener("statechange", () => { if(w.state === "activated"){ clearTimeout(t); res(reg); } });
  });
}
async function initFCM(){
  const box = $("#fcm-msg");
  const set = m => { if(box) box.textContent = m; };
  if(!fb?.messaging) return set("Cloud Messaging غير متوفر على هذا الجهاز.");
  if(!VAPID_KEY || VAPID_KEY.startsWith("COLLE")) return set("التنبيهات المحلية تخدم. باش تجي التنبيهات من بعيد لازم تحط مفتاح VAPID في index.html.");
  try{
    let reg = null;
    try{ reg = await swActive(await navigator.serviceWorker.register("firebase-messaging-sw.js?v=" + APP_VERSION, { scope:"./fcm/" })); }
    catch(e){ console.warn("fcm sw", e); }
    if(!reg || !reg.active) reg = swReg || await navigator.serviceWorker.ready;
    const token = await fb.getToken(fb.messaging, { vapidKey:VAPID_KEY, serviceWorkerRegistration:reg });
    if(!token) return set("Firebase ما رجّعش جيتون. عاود بعد شوية.");
    await fb.setDoc(ref("tokens", token.slice(0, 60)), { token, email:S.user?.email || "", at:Date.now(),
      ua:navigator.userAgent.slice(0, 120) }, { merge:true }).catch(() => {});
    set("هذا الجهاز يقبل التنبيهات حتى والتطبيق مسكّر ✓");
    fb.onMessage(fb.messaging, p => {
      const n = p.notification || {};
      toast((n.title || "تنبيه") + " — " + (n.body || ""));
    });
  }catch(e){ console.warn("FCM", e); set("خطأ : " + (e.code || e.message)); }
}

async function dailyAlerts(){
  if(!S.set.notif) return;
  if(!window.Notification || Notification.permission !== "granted") return;
  if(localStorage.getItem("mb-alert") === todayKey()) return;
  const low = lowList(), dlc = dlcList();
  if(!low.length && !dlc.length) return;
  localStorage.setItem("mb-alert", todayKey());
  const parts = [];
  if(low.length) parts.push(`${low.length} سلعة قربت توفى`);
  if(dlc.length) parts.push(`${dlc.length} سلعة قربت صلوحيتها`);
  const r = swReg || await navigator.serviceWorker.ready.catch(() => null);
  const opt = { body: parts.join(" · ") + " — شوف المخزون", icon:"icons/icon-192.png", badge:"icons/icon-192.png",
                tag:"mb-stock", vibrate:[60,40,60], data:{ page:"p-stock" } };
  if(r) r.showNotification("مزرعة البركة", opt); else new Notification("مزرعة البركة", opt);
}
function paintBell(){
  const t = $("#hd-title"); if(t && S.set.shop) t.textContent = S.set.shop;
  const b = $("#hd-bell"); if(!b) return;
  const n = alertCount();
  b.style.background = n ? "#F2A413" : "";
  b.style.color = n ? "#3A2A00" : "";
  b.title = n ? n + " تنبيه" : "ما فماش تنبيهات";
}

(async function boot(){
  buildNav();
  try{ await initFirebase(); }
  catch(e){
    console.error(e);
    $("#splash").innerHTML = `<div style="color:#fff;text-align:center;padding:26px;font-size:14px;line-height:1.8">
      ما نجمناش نوصلو لـ Firebase.<br>تثبّت من الأنترنت وعاود افتح التطبيق.<br>
      <button onclick="location.reload()" style="margin-top:14px;padding:10px 20px;border-radius:12px;border:none;background:#F2A413;font-weight:800">عاود المحاولة</button></div>`;
    return;
  }
  initSW();
  fb.onAuth(fb.auth, u => {
    S.user = u;
    $("#splash").classList.add("hidden");
    if(u){
      startSubs();
      $("#auth").classList.add("hidden");
      $("#app").classList.remove("hidden");
      setDot(navigator.onLine ? "ok" : "off");
      const h = location.hash.replace("#", "");
      go(NAV.some(n => n.id === h) ? h : "p-dash");
      setTimeout(dailyAlerts, 5000);
      if(window.Notification && Notification.permission === "granted") initFCM();
    }else{
      stopSubs();
      $("#app").classList.add("hidden");
      $("#auth").classList.remove("hidden");
      $("#au-mail").focus();
    }
  });
})();
